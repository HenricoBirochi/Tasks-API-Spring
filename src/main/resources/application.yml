spring:
  application:
    name: "tasks"

  datasource:
    url: jdbc:postgresql://localhost:5432/tasks-db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB